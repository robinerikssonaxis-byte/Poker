<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a2416">
  <meta name="description" content="Keeps track of poker buy-ins, chip counts and who owes who.">
  <title>Poker Night</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="rail">
    <div class="logo">
      <span class="suit">♠</span><span class="suit red">♥</span>
      <span class="logo-text">POKER NIGHT</span>
      <span class="suit red">♦</span><span class="suit">♣</span>
    </div>
    <div class="rail-info">
      <span id="hdr-info"></span>
      <span id="hdr-clock"></span>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="round" class="active"><span class="tab-suit">♠</span>Round</button>
    <button data-tab="history"><span class="tab-suit red">♥</span>History</button>
    <button data-tab="settle"><span class="tab-suit red">♦</span>Settle up</button>
    <button data-tab="settings"><span class="tab-suit">♣</span>Settings</button>
  </nav>

  <div id="sheets"></div>
  <div id="toast" role="status"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>

  <noscript>Poker Night needs JavaScript to run.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
